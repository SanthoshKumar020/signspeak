{% extends "base.html" %}
{% block title %}Login — SignSpeak{% endblock %}
{% block content %}
<section class="auth">
  <h1>Welcome back</h1>
  <form method="post" class="auth-form">
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-big" type="submit">Login</button>
  </form>
  <p class="muted">New to SignSpeak? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
